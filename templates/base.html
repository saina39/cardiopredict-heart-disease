<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CardioPredict{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="bg-gradient" aria-hidden="true"></div>

<header class="site-header">
  <a href="{{ url_for('home') }}" class="brand">
    <svg class="brand-mark" viewBox="0 0 32 20" width="28" height="18" aria-hidden="true">
      <polyline points="0,10 8,10 11,2 15,18 19,10 32,10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    CardioPredict
  </a>
  <nav class="site-nav">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('predict_page') }}">Predict</a>
    <a href="{{ url_for('about') }}">Model Info</a>
  </nav>
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark and light mode" type="button">
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 4V2m0 20v-2m8-8h2M2 12h2m14.36 6.36l1.42 1.42M4.22 4.22l1.42 1.42m0 12.72l-1.42 1.42M18.36 5.64l1.42-1.42M12 7a5 5 0 100 10 5 5 0 000-10z"/></svg>
  </button>
</header>

<main class="page-content">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p>CardioPredict &mdash; a machine-learning demo trained on the UCI Heart Disease dataset.</p>
  <p class="disclaimer">Not a medical device. Always consult a licensed clinician for diagnosis or treatment decisions.</p>
</footer>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
